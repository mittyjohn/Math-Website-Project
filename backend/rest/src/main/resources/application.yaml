spring:
  application:
    name: rest

## PostgreSQL
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost/postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      connectionTimeout: 20000
